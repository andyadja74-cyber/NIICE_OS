name: NIICE OS Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          which sdkmanager
          sdkmanager --version

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android platform
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platforms;android-35"

      - name: Install build tools
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install "build-tools;35.0.0"

      - name: Install platform tools
        run: |
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1

      - name: Build NIICE OS
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIICE-OS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
