plugins {
    id 'com.android.application'
}

android {
    namespace 'com.niice.os'
    compileSdk 35

    defaultConfig {
        applicationId 'com.niice.os'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
